<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">方案 C：连续墨线，九个手绘控件图标</title>
  <desc id="desc">首页、文稿、碎念、更多、GitHub、邮件、QQ、月亮和太阳图标的连续墨线稿。</desc>
  <rect width="1200" height="650" fill="#f3f1ec"/>
  <style>
    .title { fill:#262320; font: 34px Georgia, "Noto Serif SC", serif; }
    .sub { fill:#777168; font: 15px Inter, "PingFang SC", sans-serif; }
    .label { fill:#302d29; font: 20px "Noto Serif SC", Georgia, serif; }
    .label-active { fill:#c25668; font: 20px "Noto Serif SC", Georgia, serif; }
    .note { fill:#827b72; font: 12px Inter, "PingFang SC", sans-serif; letter-spacing:.08em; }
    .cell { fill:#fbfaf7; }
    .ink { fill:none; stroke:#302d29; stroke-width:2.8; stroke-linecap:round; stroke-linejoin:round; }
    .fine { fill:none; stroke:#746e66; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round; opacity:.62; }
    .accent { fill:none; stroke:#c25668; stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; }
    .accent-fill { fill:#c25668; }
  </style>

  <text x="72" y="62" class="title">C · 连续墨线</text>
  <text x="72" y="92" class="sub">图标的尾笔继续走成下划线或不完整光环；界面仍是文字主导，线稿只留下手写痕迹。</text>

