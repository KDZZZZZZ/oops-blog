<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">方案 B：手账印章，九个手绘控件图标</title>
  <desc id="desc">首页、文稿、碎念、更多、GitHub、邮件、QQ、月亮和太阳图标的手账印章稿。</desc>
  <defs>
    <pattern id="roseHatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(12)">
      <line x1="0" y1="0" x2="0" y2="9" stroke="#c25668" stroke-width="1" opacity=".22"/>
    </pattern>
  </defs>
  <rect width="1200" height="650" fill="#f3f1ec"/>
  <style>
    .title { fill:#262320; font: 34px Georgia, "Noto Serif SC", serif; }
    .sub { fill:#777168; font: 15px Inter, "PingFang SC", sans-serif; }
    .label { fill:#302d29; font: 19px "Noto Serif SC", Georgia, serif; }
    .note { fill:#827b72; font: 12px Inter, "PingFang SC", sans-serif; letter-spacing:.08em; }
    .cell { fill:#fbfaf7; }
    .stamp { fill:#f7f4ee; stroke:#302d29; stroke-width:2.6; stroke-linecap:round; stroke-linejoin:round; }
    .stamp-soft { fill:none; stroke:#817a71; stroke-width:1.2; stroke-linecap:round; stroke-linejoin:round; opacity:.45; }
    .ink { fill:none; stroke:#302d29; stroke-width:2.8; stroke-linecap:round; stroke-linejoin:round; }
    .fine { fill:none; stroke:#302d29; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
    .accent { fill:none; stroke:#c25668; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }
    .accent-fill { fill:#c25668; }
  </style>

  <text x="72" y="62" class="title">B · 手账印章</text>
  <text x="72" y="92" class="sub">每个入口是一枚不完全规整的小章；图形更醒目，适合想让顶部栏更有性格的版本。</text>

