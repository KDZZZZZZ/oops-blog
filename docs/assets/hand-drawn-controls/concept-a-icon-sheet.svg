    <g transform="translate(35 27)">
      <path class="soft" d="M4 42C4 19 21 4 43 4C67 4 82 21 81 43C80 66 65 81 42 81C20 81 4 65 4 42Z"/>
      <path class="ink" d="M43 27C53 26 61 34 60 43C59 53 52 59 43 59C33 59 26 52 27 42C27 33 34 27 43 27Z"/>
