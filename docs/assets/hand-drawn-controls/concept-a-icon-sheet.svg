  <path d="M72 616C351 613 855 619 1128 615" fill="none" stroke="#c25668" stroke-width="1.2" opacity=".48"/>
  <text x="72" y="636" class="note">90% 炭笔线 · 5% 玫瑰色 · 固定路径，不使用动态抖动</text>
</svg>
