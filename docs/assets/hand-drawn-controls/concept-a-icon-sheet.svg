<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">方案 A：安静边注，九个手绘控件图标</title>
  <desc id="desc">首页、文稿、碎念、更多、GitHub、邮件、QQ、月亮和太阳图标的手绘线稿。</desc>
  <rect width="1200" height="650" fill="#f3f1ec"/>
  <style>
    .title { fill:#262320; font: 34px Georgia, "Noto Serif SC", serif; }
    .sub { fill:#777168; font: 15px Inter, "PingFang SC", sans-serif; }
    .label { fill:#302d29; font: 19px "Noto Serif SC", Georgia, serif; }
    .note { fill:#827b72; font: 12px Inter, "PingFang SC", sans-serif; letter-spacing:.08em; }
    .cell { fill:#fbfaf7; stroke:#d8d2c8; stroke-width:1.2; }
    .ink { fill:none; stroke:#302d29; stroke-width:3; stroke-linecap:round; stroke-linejoin:round; }
    .soft { fill:none; stroke:#817a71; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round; opacity:.42; }
    .accent { fill:none; stroke:#c25668; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; }
    .accent-fill { fill:#c25668; }
  </style>

  <text x="72" y="62" class="title">A · 安静边注</text>
  <text x="72" y="92" class="sub">小图标置于文字前，完整轮廓保证识别；玫瑰色只留一个笔记式记号。</text>

